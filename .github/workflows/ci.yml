name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap0.8
      - name: Build overlay for both targets
        run: dotnet build src/AionMeter.Overlay/AionMeter.Overlay.csproj -c Release
      - name: Test
        run: dotnet test tests/AionMeter.Tests/AionMeter.Tests.csproj -c Release

  windows-build:
    runs-on: windows-latest
    env:
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
      INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish the overlay for Windows
        run: dotnet publish src/AionMeter.Overlay/AionMeter.Overlay.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:DebugType=none -p:DebugSymbols=false -o publish/BeyondMeter
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest $env:INNO_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup7"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path (Join-Path $dir "ISCC.exe"))) { throw "ISCC.exe not found in $dir" }
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build the installer with the overlay
        shell: pwsh
        run: |
          ISCC.exe /Qp "/DAppVer=0.0.0" "/DPayloadDir=$PWD\publish\BeyondMeter" "/O$PWD\dist" installer\AION2DpsMeter.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path dist\BeyondMeter-Setup-v0.0.0.exe)) { throw "the installer is missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: beyond-meter-overlay-win-x64
          path: publish/BeyondMeter
          retention-days: 14
